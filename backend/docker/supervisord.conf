[supervisord]
nodaemon=true
user=root
; No separate supervisor log file: nodaemon mode already mirrors supervisor's own activity log
; (spawn errors, "gave up: … entered FATAL state") to stdout, so it lands in the container log.
; Pointing logfile at /dev/fd/1 as well would duplicate every one of those lines.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; supervisorctl needs an RPC endpoint. Without these three sections it fails with
; "ini file does not include supervisorctl section" and single programs cannot be
; inspected or restarted (`supervisorctl status`, `supervisorctl restart script-worker`).
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:frankenphp]
command=frankenphp run --config /etc/frankenphp/Caddyfile
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

; In-container scheduler (supercronic, crontab at /etc/cron.d/ukolio): dispatches
; due Scheduled scripts every minute (scripts:tick) and runs the hourly due-date
; reminder (notifications:due-tick) and recurring-task (recurring-tasks:tick) ticks.
[program:cron]
command=supercronic /etc/cron.d/ukolio
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:amqp-consumer]
command=php /app/src/amqp-consumer.php
autorestart=true
startsecs=5
; A dependency that is briefly unreachable at boot (RabbitMQ restarting) must not disable the
; queues for good; the default of 3 start retries is reached within seconds.
startretries=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

; Dedicated consumer for the script-run queue. Runs the V8 sandbox, so it loads
; ext-v8js (-d extension=v8js.so) — scoped to this process so libnode/V8 stays
; out of FrankenPHP and the main amqp-consumer. The main consumer deliberately
; skips the ScriptRun queue (see amqp-consumer.php).
[program:script-worker]
command=php -d extension=v8js.so /app/src/script-worker.php
; Drop privileges: the V8 sandbox executes user-authored JS, so a V8 escape lands
; as this unprivileged UID (created in the Dockerfile), not root.
user=ukolio-script
; Own log directory, created and made writable for this UID by docker-entrypoint.sh. The shared
; /app/log files belong to the root-run processes, and Tracy aborts the process when it cannot
; append to its log file — which is what silently killed this worker before.
environment=BACKEND_LOG_DIR="/app/log/script"
autorestart=true
startsecs=5
startretries=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true
